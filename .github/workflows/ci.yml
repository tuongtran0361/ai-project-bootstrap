name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: repository-validation
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository
        shell: pwsh
        run: ./work/verify-repository.ps1

      - name: Set up selected profile
        if: ${{ hashFiles('.github/actions/profile-validation/action.yml') != '' }}
        uses: ./.github/actions/profile-validation

      - name: Validate selected profile
        if: ${{ hashFiles('work/verify-profile.ps1') != '' }}
        shell: pwsh
        run: ./work/verify-profile.ps1
